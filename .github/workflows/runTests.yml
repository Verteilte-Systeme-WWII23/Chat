name: Tests & Code Quality

on:
  # Manuell über GitHub UI
  workflow_dispatch:
  
  # Bei Push auf Hauptbranches
  push:
    branches: [main, master, develop, development]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
  
  # Bei Pull Requests auf Hauptbranches
  pull_request:
    branches: [main, master, develop, development]

permissions:
  contents: write # Erlaubt Schreiben auf gh-pages

jobs:
  # Unit & Integration Tests mit Coverage
  unit-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests and collect coverage
        run: npm run test:coverage
        env:
          # Alle benötigten Umgebungsvariablen
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage

      - name: Deploy Coverage to GitHub Pages
        if: github.ref == 'refs/heads/main' # Nur auf dem main Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./coverage

  # E2E Tests mit Cypress
  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-integration-tests # Optional: Erst nach Unit-Tests ausführen
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          start: node test/e2e/test-server.js
          wait-on: http://localhost:3001
          wait-on-timeout: 60
          config-file: test/e2e/cypress.config.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
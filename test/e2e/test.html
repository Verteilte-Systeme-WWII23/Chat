<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat-Anwendung</title>
    <link rel="stylesheet" href="test.css" />
    <script type="module" src="/components/chat/mein-chat.js"></script>
  </head>
  <body>
    <main>
      <h1>Live-Chat</h1>
      <p>
        Verbinde dich mit anderen Nutzern oder stelle Fragen an unsere KI. Deine
        Chats sind in einer schwebenden Komponente verfügbar.
      </p>
      <button id="open-chat-btn">Chat öffnen</button>
      <footer>&copy; 2025 DHBW Chat-Anwendung</footer>
    </main>

    <mein-chat server-url="localhost:3001">
<span slot="header-title">
  <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f4ac.svg" alt="Chat Icon" class="header-chat-icon" style="vertical-align: middle; height: 1.2em;" />
  <span style="vertical-align: middle;">Mein DHBW Chat</span>
</span>    </mein-chat>

    <script>
      document.getElementById("open-chat-btn").onclick = () => {
        document.querySelector("mein-chat").style.display = "block";
      };
    </script>
  </body>
</html>
